[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagegen-core"
version = "1.0.0"
description = "ImageGen standalone local image generation application with CLI, HTTP API, WebUI and Codex integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
image = ["Pillow"]
library = ["numpy", "pymysql"]

[project.scripts]
imagegen = "imagegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["imagegen*"]

[tool.setuptools.package-data]
imagegen = [
  "web/static/*.html",
  "web/static/*.js",
  "web/static/*.css",
]
