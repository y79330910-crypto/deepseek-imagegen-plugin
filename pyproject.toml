[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagegen-core"
version = "1.0.0"
description = "DeepSeek ImageGen Core：独立于 Codex 插件结构的图像生成核心（Public API + Services）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
image = ["Pillow"]
library = ["numpy", "pymysql"]

[project.scripts]
imagegen = "imagegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["imagegen*"]
