[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagegen"
dynamic = ["version"]
description = "Standalone image generation application with CLI, WebUI and local HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
image = ["Pillow"]
library = ["numpy", "pymysql"]

[project.scripts]
imagegen = "imagegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["imagegen*"]

[tool.setuptools.dynamic]
version = {attr = "imagegen._version.__version__"}

[tool.setuptools.package-data]
imagegen = [
  "web/static/*.html",
  "web/static/*.js",
  "web/static/*.css",
]
