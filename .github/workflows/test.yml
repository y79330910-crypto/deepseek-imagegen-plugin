name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        run: python -m unittest

      - name: Standalone CLI
        run: |
          python -m imagegen --help
          python -m imagegen config --json
          python -m imagegen serve --help

      - name: Core import without Codex plugin dirs
        run: |
          mv plugins/deepseek-imagegen/.codex-plugin /tmp/codex-plugin-disabled
          mv plugins/deepseek-imagegen/skills /tmp/codex-skills-disabled
          python -c "import imagegen; assert imagegen.CORE_API_VERSION == 1"
          python -m imagegen --help
